

trigger:
    branches:
      include:
        - develop
        - master
        
variables:
  packageName: 'socketx-client-android'
  packageDirectory: '$(Build.Repository.LocalPath)'
  androidSdkDirectory: '/Users/eclypsesaccount/Library/Android/sdk'


pool: 'MacOS - Intel'

steps:

- script: |
    set -euo pipefail

    SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(androidSdkDirectory)}}"

    if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
      echo "Android SDK directory not found. Checked: '$SDK_DIR'"
      echo "Set ANDROID_HOME/ANDROID_SDK_ROOT on the agent, or update 'androidSdkDirectory' in azure-pipelines.yml."
      exit 1
    fi

    echo "Using Android SDK at: $SDK_DIR"
    echo "##vso[task.setvariable variable=ANDROID_HOME]$SDK_DIR"
    echo "##vso[task.setvariable variable=ANDROID_SDK_ROOT]$SDK_DIR"
    echo "sdk.dir=$SDK_DIR" > local.properties
  displayName: 'Resolve Android SDK and create local.properties'
  condition: succeeded()

- script: |
    ./gradlew :socketx-client-android:lint :socketx-client-android:testDebugUnitTest
  displayName: 'Run lint and unit tests'
  condition: succeeded()

- script: |
    ./gradlew :socketx-client-android:jacocoTestReport :socketx-client-android:jacocoTestCoverageVerification
  displayName: 'Run coverage report and threshold verification (develop only)'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))

- task: PublishCodeCoverageResults@2
  displayName: 'Publish JaCoCo coverage'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  inputs:
    summaryFileLocation: '$(packageDirectory)/socketx-client-android/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml'
    pathToSources: '$(packageDirectory)/socketx-client-android/src/main/java'
    failIfCoverageEmpty: false

- task: InstallSSHKey@0
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
  displayName: 'Install the SSH key'
  inputs:
    knownHostsEntry: '$(known_hosts_entry)'
    sshPublicKey: '$(ado_pk)'
    sshKeySecureFile: 'id_ed25519'

- task: DeleteFiles@1
  displayName: 'Delete unnecessary files before push to public remote'
  condition: and(
               succeeded(),
               eq(variables['Build.SourceBranch'], 'refs/heads/master')
             )
  inputs:
    SourceFolder: $(packageDirectory)
    Contents: |
      .gitignore
      **/*.yml
      dev_docs
      release.sh

- script: |
    git add .
    git commit -am 'Commit unnecessary file deletion'
  displayName: 'Commit unnecessary file deletion'
  condition: and(
               succeeded(),
               eq(variables['Build.SourceBranch'], 'refs/heads/master')
             )
  workingDirectory: $(packageDirectory)

- task: CmdLine@2
  displayName: 'Push to Public GitHub'
  condition: and(
               succeeded(),
               eq(variables['Build.SourceBranch'], 'refs/heads/master')
             )
  inputs:
    script: |
      ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      git push git@github.com:Eclypses/$(Build.Repository.Name).git HEAD:refs/heads/public --force  --tags
    workingDirectory: $(packageDirectory)

